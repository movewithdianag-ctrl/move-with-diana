# ─────────────────────────────────────────────────────────────────────────────
# Move with Diana — admin panel configuration (Decap CMS + DecapBridge)
#
# Login is handled by DecapBridge (decapbridge.com): Diana signs in with
# email+password or Google — no GitHub account needed.
#
# Managed at decapbridge.com → site "Move with Diana G". To add or remove
# editors, use that dashboard's "Manage collaborators" tab.
# ─────────────────────────────────────────────────────────────────────────────
backend:
  name: git-gateway
  repo: movewithdianag-ctrl/move-with-diana
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/25cc41d9-09aa-4d24-aecf-315d9a634ffc/pkce
  auth_token_endpoint: /sites/25cc41d9-09aa-4d24-aecf-315d9a634ffc/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" — {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" — {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" — {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" — {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" — {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} — {{author-name}} <{{author-login}}> via DecapBridge

# Records who made each change (shown in the site's history).
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Lets me test the admin on localhost with `npx decap-server`; ignored in
# production (only activates when the panel is opened on localhost).
local_backend: true

site_url: https://movewithdianag.com
display_url: https://movewithdianag.com

# Uploaded photos are committed into the repo and served from /images/uploads.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "content"
    label: "Website content"
    description: "Every word and photo on the site. Pick a page, edit, then press Publish — changes appear on the live site about 2 minutes later."
    editor:
      preview: false
    files:
      # ───────────────────────────── SITE SETTINGS ─────────────────────────
      - name: "settings"
        label: "Site settings (name, links, menu)"
        file: "src/content/settings.json"
        fields:
          - { label: "Business name", name: "siteName", widget: "string", hint: "Shown in the top-left corner of every page and in the footer." }
          - { label: "Contact email", name: "email", widget: "string", hint: "Where the contact form's mailto links point. Changing this does NOT change where form submissions are delivered — that lives in Web3Forms." }
          - { label: "\"Based in…\" line", name: "basedInLine", widget: "string", hint: "The location line shown under the contact form." }
          - label: "Social media links"
            name: "socials"
            widget: "list"
            summary: "{{fields.label}}"
            hint: "The icon links in the footer, menu, and contact page. Keep the Platform name exactly Instagram, TikTok, or YouTube so the right icon appears."
            fields:
              - { label: "Platform name", name: "label", widget: "string" }
              - { label: "Link (full web address)", name: "url", widget: "string" }
          - { label: "Community link (Skool)", name: "communityUrl", widget: "string", required: false, hint: "Paste your Skool community web address here. While this is empty, all \"Join the community\" buttons send people to the contact form instead." }
          - { label: "Google Calendar embed address", name: "calendarUrl", widget: "string", required: false, hint: "Only used when the weekly schedule section is turned on. Get this from Google Calendar → Settings → Integrate calendar." }
          - { label: "Show the weekly schedule section", name: "showSchedule", widget: "boolean", required: false, hint: "Turn on to show the weekly schedule on the home page (plus a Schedule link in the menu)." }
          - label: "Menu labels"
            name: "nav"
            widget: "object"
            hint: "The words in the navigation menu. The pages they lead to never change."
            fields:
              - { label: "Home", name: "home", widget: "string" }
              - { label: "About", name: "about", widget: "string" }
              - { label: "Offers", name: "offers", widget: "string" }
              - { label: "Reviews", name: "reviews", widget: "string" }
              - { label: "Schedule", name: "schedule", widget: "string" }
              - { label: "Contact", name: "contact", widget: "string" }
              - { label: "Top-right button", name: "button", widget: "string", hint: "The dark button in the top-right corner. It opens your Skool community while the Community link (in Site settings) is filled in; if that link is empty, it opens the contact page." }

      # ─────────────────────────────── HOME PAGE ───────────────────────────
      - name: "home"
        label: "Home page"
        file: "src/content/home.json"
        fields:
          - label: "Search & browser-tab info"
            name: "meta"
            widget: "object"
            collapsed: true
            hint: "What Google and the browser tab show for this page."
            fields:
              - { label: "Browser-tab title", name: "title", widget: "string" }
              - { label: "Search description", name: "description", widget: "text", hint: "1–2 sentences. Google often shows this under the page title." }
          - label: "Top of the page (hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Big headline", name: "headline", widget: "string" }
              - { label: "Sentence under the headline", name: "subhead", widget: "text" }
              - { label: "Main button", name: "primaryButton", widget: "string", hint: "Opens the 8-Week Pilates Program application (/apply)." }
              - { label: "Second button", name: "offersButton", widget: "string", required: false, hint: "Leads to the Offers page. Leave empty to hide the button." }
              - { label: "Second button (when schedule is on)", name: "scheduleButton", widget: "string", hint: "Used instead of the one above while the weekly schedule section is turned on." }
              - { label: "Hero photo (wide, for computers)", name: "photo", widget: "image", hint: "A wide photo works best — it fills the top of the page edge to edge." }
              - { label: "Hero photo (tall, for phones)", name: "photoMobile", widget: "image", hint: "A tall crop of the same photo, shown on phones. Keep the subject centered." }
              - { label: "Photo description", name: "photoAlt", widget: "string", hint: "Describes the photo for people using screen readers. One short sentence." }
          - label: "Weekly schedule section text"
            name: "schedule"
            widget: "object"
            collapsed: true
            hint: "Only shown when the schedule section is turned on in Site settings."
            fields:
              - { label: "Small label above the heading", name: "eyebrow", widget: "string" }
              - { label: "Section heading", name: "heading", widget: "string" }
              - { label: "Line under the heading", name: "subline", widget: "text" }
              - { label: "\"Sample schedule\" note", name: "sampleNote", widget: "string", hint: "Shown only if no calendar address is set." }
              - { label: "Sample schedule button", name: "sampleCta", widget: "string" }
              - { label: "Empty-day label", name: "restDayLabel", widget: "string" }
          - { label: "FAQ section heading", name: "faqHeading", widget: "string" }
          - label: "FAQ questions & answers"
            name: "faqs"
            widget: "list"
            summary: "{{fields.question}}"
            hint: "Drag the handle on the left of each item to reorder. Use the + button to add and the … menu to delete."
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }
          - label: "Reviews at the end of the page"
            name: "reviews"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - label: "Which reviews to show"
                name: "names"
                widget: "list"
                field: { label: "Client name", name: "name", widget: "string" }
                hint: "Up to six names, shown as cards in this order, the same as on the Reviews page. Type each name exactly as it appears in \"Testimonials (your Trustpilot reviews)\". The quote is pulled from there. A name that doesn't match is skipped."
              - { label: "Review count line", name: "countLine", widget: "string", hint: "{count} becomes the number of saved reviews." }
              - { label: "Link to the Reviews page", name: "linkLabel", widget: "string" }

      # ─────────────────────────────── ABOUT PAGE ──────────────────────────
      - name: "about"
        label: "About page"
        file: "src/content/about.json"
        fields:
          - label: "Search & browser-tab info"
            name: "meta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Browser-tab title", name: "title", widget: "string" }
              - { label: "Search description", name: "description", widget: "text" }
          - { label: "Small label above the name", name: "pageLabel", widget: "string" }
          - { label: "Page heading", name: "heading", widget: "string", hint: "Usually your name." }
          - { label: "Portrait photo", name: "photo", widget: "image", hint: "A tall (portrait) photo works best here." }
          - { label: "Photo description", name: "photoAlt", widget: "string", hint: "For screen readers. One short sentence." }
          - label: "Bio paragraphs"
            name: "bio"
            widget: "list"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }
            hint: "Each item is one paragraph. Drag to reorder."
          - label: "\"Join the community\" section"
            name: "community"
            widget: "object"
            fields:
              - { label: "Small label above the heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Button", name: "button", widget: "string", hint: "Opens your Skool community once its link is set in Site settings; until then it opens the contact form." }

      # ──────────────────────────────── OFFERS ─────────────────────────────
      - name: "offers"
        label: "Offers"
        file: "src/content/offers.json"
        fields:
          - label: "Search & browser-tab info"
            name: "meta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Browser-tab title", name: "title", widget: "string" }
              - { label: "Search description", name: "description", widget: "text" }
          - { label: "Offers page heading", name: "heading", widget: "string" }
          - { label: "\"Who it's for\" label", name: "whoLabel", widget: "string", hint: "The small bold label before each offer's who-it's-for sentence." }
          - label: "The offers"
            name: "offers"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "These appear on the home-page carousel AND the Offers page, in this order. Drag to reorder, + to add, … menu to delete."
            fields:
              - { label: "Offer name", name: "title", widget: "string" }
              - { label: "One-line summary", name: "oneLiner", widget: "string", hint: "Shown under the photo on the home-page carousel." }
              - { label: "Full description", name: "description", widget: "text", hint: "Shown on the Offers page." }
              - { label: "Who it's for", name: "whoItsFor", widget: "text" }
              - label: "What's included"
                name: "included"
                widget: "list"
                field: { label: "Line", name: "line", widget: "string" }
                hint: "Short lines with checkmarks. 3–4 works best."
              - { label: "Button text", name: "buttonLabel", widget: "string", hint: "Say what happens, e.g. \"Book a private session\"." }
              - { label: "Contact form option", name: "contactOption", widget: "string", hint: "Advanced — must exactly match one of the \"value\" codes on the Contact page's dropdown options (e.g. private-1:1). It preselects that option when someone clicks this offer." }
              - { label: "Carousel photo (home page)", name: "cardPhoto", widget: "image", hint: "Tall photos look best — they show uncropped." }
              - { label: "Carousel photo description", name: "cardPhotoAlt", widget: "string" }
              - { label: "(auto) photo width", name: "cardPhotoW", widget: "hidden", required: false }
              - { label: "(auto) photo height", name: "cardPhotoH", widget: "hidden", required: false }
              - { label: "Offers-page photo", name: "pagePhoto", widget: "image", required: false, hint: "The photo on the Offers page row. Can be the same or different from the carousel photo." }
              - { label: "Offers-page photo description", name: "pagePhotoAlt", widget: "string", required: false }
              - { label: "Show offers-page photo tall & uncropped", name: "pagePhotoTall", widget: "boolean", required: false, hint: "On for tall photos; off crops the photo to a wide shape." }
              - { label: "(auto) photo width", name: "pagePhotoW", widget: "hidden", required: false }
              - { label: "(auto) photo height", name: "pagePhotoH", widget: "hidden", required: false }

      # ────────────────────────────── REVIEWS PAGE ─────────────────────────
      - name: "reviews"
        label: "Reviews page"
        file: "src/content/reviews.json"
        fields:
          - label: "Search & browser-tab info"
            name: "meta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Browser-tab title", name: "title", widget: "string" }
              - { label: "Search description", name: "description", widget: "text", hint: "1–2 sentences. Google often shows this under the page title." }
          - { label: "Small label above the heading", name: "eyebrow", widget: "string" }
          - { label: "Page heading", name: "heading", widget: "string", hint: "To rename the menu link too, change it in Site settings → Menu labels." }
          - { label: "Line under the heading", name: "intro", widget: "text" }
          - { label: "\"No reviews yet\" line", name: "comingSoon", widget: "string", required: false, hint: "Shown only until the Trustpilot review box is connected." }
          - label: "Trustpilot connection"
            name: "trustpilot"
            widget: "object"
            collapsed: true
            hint: "The live review box. The value codes are wiring — Nick sets them once; leave them alone."
            fields:
              - { label: "Business value code (internal)", name: "businessUnitId", widget: "string", required: false }
              - { label: "Widget style value code (internal)", name: "templateId", widget: "string", required: false }
              - { label: "Language value code (internal)", name: "locale", widget: "string", required: false }
              - { label: "Colour value code (internal)", name: "theme", widget: "string", required: false }
              - { label: "Box height value code (internal)", name: "heightPx", widget: "number", value_type: "int", required: false }
              - { label: "Your public Trustpilot page link", name: "profileUrl", widget: "string", required: false, hint: "Your business page on trustpilot.com." }
              - { label: "\"Write a review\" link", name: "reviewUrl", widget: "string", required: false, hint: "The link you send clients to leave a review. While it's filled in, a button shows on the page." }
              - { label: "\"Write a review\" button text", name: "reviewButtonLabel", widget: "string", required: false }
          - { label: "Also show the saved client testimonials", name: "showSavedTestimonials", widget: "boolean", required: false, hint: "Turn on to show the quotes from \"Testimonials (your Trustpilot reviews)\" under the Trustpilot reviews." }

      # ────────────────────────────── CONTACT PAGE ─────────────────────────
      - name: "contact"
        label: "Contact page"
        file: "src/content/contact.json"
        fields:
          - label: "Search & browser-tab info"
            name: "meta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Browser-tab title", name: "title", widget: "string" }
              - { label: "Search description", name: "description", widget: "text" }
          - { label: "Small label above the heading", name: "pageLabel", widget: "string" }
          - { label: "Page heading", name: "heading", widget: "string" }
          - { label: "Intro sentence", name: "opening", widget: "text" }
          - { label: "Photo beside the form", name: "photo", widget: "image", hint: "Tall photo, shown to the right of the form on computers." }
          - { label: "Photo description", name: "photoAlt", widget: "string" }
          - label: "\"I'm interested in\" dropdown options"
            name: "options"
            widget: "list"
            summary: "{{fields.label}}"
            hint: "What people can pick in the form. \"Shown text\" is what they see; \"value code\" is internal — if you change it, update any offer that points at it."
            fields:
              - { label: "Value code (internal)", name: "value", widget: "string" }
              - { label: "Shown text", name: "label", widget: "string" }
          - label: "Form labels"
            name: "labels"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Name field", name: "name", widget: "string" }
              - { label: "Email field", name: "email", widget: "string" }
              - { label: "Phone field", name: "phone", widget: "string" }
              - { label: "Interest dropdown", name: "interest", widget: "string" }
              - { label: "Dropdown placeholder", name: "interestPlaceholder", widget: "string" }
              - { label: "Message field", name: "message", widget: "string" }
              - { label: "Message placeholder", name: "messagePlaceholder", widget: "string" }
              - { label: "Send button", name: "submit", widget: "string" }
              - { label: "Send button while sending", name: "submitting", widget: "string" }
          - label: "Error messages"
            name: "errors"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Missing name", name: "nameRequired", widget: "string" }
              - { label: "Missing email", name: "emailRequired", widget: "string" }
              - { label: "Email looks wrong", name: "emailInvalid", widget: "string" }
              - { label: "Nothing picked in dropdown", name: "interestRequired", widget: "string" }
              - { label: "Missing message", name: "messageRequired", widget: "string" }
          - label: "Thank-you message (after sending)"
            name: "success"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "body", widget: "string" }
          - label: "If sending fails"
            name: "failure"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Error text", name: "text", widget: "string" }
              - { label: "Email link text", name: "mailtoLabel", widget: "string" }
          - label: "Photo strip (bottom of the page)"
            name: "gallery"
            widget: "list"
            summary: "{{fields.alt}}"
            hint: "The band of photos above the footer. Drag an item's grey bar to reorder, + Add to add, and the small x on the grey bar deletes it. Tall photos look best."
            fields:
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Photo description", name: "alt", widget: "string", hint: "For screen readers. One short sentence." }
              - { label: "(auto) width", name: "w", widget: "hidden", required: false }
              - { label: "(auto) height", name: "h", widget: "hidden", required: false }

      # ─────────────────────────── FOOTER & EXTRAS ─────────────────────────
      - name: "footer"
        label: "Footer & extras"
        file: "src/content/footer.json"
        fields:
          - { label: "Footer tagline", name: "oneLiner", widget: "string", hint: "The line under the business name in the footer." }
          - { label: "\"Pages\" column heading", name: "pagesHeading", widget: "string" }
          - { label: "\"Connect\" column heading", name: "connectHeading", widget: "string" }
          - { label: "Community link text", name: "communityLinkLabel", widget: "string", hint: "Appears in the footer once the Skool link is set in Site settings." }
          - label: "Newsletter box"
            name: "newsletter"
            widget: "object"
            fields:
              - { label: "Newsletter name", name: "heading", widget: "string" }
              - { label: "Description", name: "text", widget: "text" }
              - { label: "Email box placeholder", name: "placeholder", widget: "string" }
              - { label: "Sign-up button", name: "button", widget: "string" }
              - { label: "Success message", name: "successToast", widget: "string" }
              - { label: "Bad-email message", name: "invalidEmailText", widget: "string" }
              - { label: "Error message", name: "errorText", widget: "string" }
          - label: "\"Page not found\" page"
            name: "notFound"
            widget: "object"
            collapsed: true
            hint: "What visitors see if they follow a broken link."
            fields:
              - { label: "Browser-tab title", name: "metaTitle", widget: "string" }
              - { label: "Search description", name: "metaDescription", widget: "text" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "text", widget: "string" }
              - { label: "Button", name: "button", widget: "string" }

      # ────────────────────────────── TESTIMONIALS ─────────────────────────
      - name: "testimonials"
        label: "Testimonials (your Trustpilot reviews)"
        file: "src/content/testimonials.json"
        fields:
          - { label: "Section heading", name: "heading", widget: "string", hint: "These show on the Reviews page when \"Also show the saved client testimonials\" is turned on there. The list also feeds the 8-Week Program order page: the quotes you pick there come from here, and the review count shown there is the number of entries in this list. So only add reviews that are on your Trustpilot page." }
          - { label: "Small label above the heading", name: "eyebrow", widget: "string" }
          - { label: "\"Read more\" link text", name: "readMore", widget: "string" }
          - { label: "\"Read less\" link text", name: "readLess", widget: "string" }
          - label: "Client testimonials"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            hint: "Drag an item's grey bar to reorder, + Add to add, and the small x on the grey bar deletes it."
            fields:
              - { label: "Client name", name: "name", widget: "string" }
              - { label: "Their words", name: "quote", widget: "text" }

      # ───────────────── 8-WEEK PROGRAM (order page, welcome, booking) ─────
      - name: "program"
        label: "8-Week Program (order page, welcome, booking)"
        file: "src/content/program.json"
        fields:
          - label: "Search & browser-tab info"
            name: "meta"
            widget: "object"
            collapsed: true
            hint: "What the browser tab shows on each program page. The order and welcome pages are hidden from Google on purpose."
            fields:
              - label: "Order page"
                name: "checkout"
                widget: "object"
                fields:
                  - { label: "Browser-tab title", name: "title", widget: "string" }
                  - { label: "Search description", name: "description", widget: "text" }
              - label: "Welcome page (after payment)"
                name: "welcome"
                widget: "object"
                fields:
                  - { label: "Browser-tab title", name: "title", widget: "string" }
                  - { label: "Search description", name: "description", widget: "text" }
          - label: "Slim header & footer on the program pages"
            name: "chrome"
            widget: "object"
            collapsed: true
            hint: "The application, order and welcome pages use a slim header and footer instead of the full menu, so people stay focused."
            fields:
              - { label: "Logo link description", name: "homeLabel", widget: "string", hint: "Read aloud by screen readers. Not shown on screen." }
              - { label: "Email subject for questions", name: "questionsSubject", widget: "string", hint: "The subject line already filled in when someone taps an email link on the program pages." }
              - { label: "Progress trail description", name: "stepsLabel", widget: "string", hint: "The small Apply, Reserve, Book trail in the header. Read aloud by screen readers. Not shown on screen." }
              - { label: "Progress trail, step 1", name: "stepApply", widget: "string", hint: "One short word. Lit on the application form." }
              - { label: "Progress trail, step 2", name: "stepReserve", widget: "string", hint: "One short word. Lit on the order page." }
              - { label: "Progress trail, step 3", name: "stepBook", widget: "string", hint: "One short word. Lit on the welcome page." }
              - { label: "Footer disclaimer", name: "footerDisclaimer", widget: "string", required: false, hint: "Small print at the bottom of the funnel pages. Leave empty to hide it." }
          - { label: "Program name (full)", name: "name", widget: "string" }
          - { label: "Program name (short)", name: "shortName", widget: "string", hint: "Used where space is tight." }
          - { label: "\"What's included\" heading", name: "includedHeading", widget: "string" }
          - label: "What's included"
            name: "included"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "Shown open on the order page, as a grid of short items. The four short lines beside the pay button are separate: Order page, Order page extras, Short lines above the pay button. Drag an item's grey bar to reorder, + Add to add, and the small x on the grey bar deletes it."
            fields:
              - { label: "Item", name: "title", widget: "string" }
              - { label: "Short explanation", name: "detail", widget: "text" }
          - { label: "\"How it works\" heading", name: "howItWorksHeading", widget: "string" }
          - label: "How the 8 weeks work"
            name: "howItWorks"
            widget: "list"
            required: false
            hint: "With no steps, the whole section is hidden."
            summary: "{{fields.title}}"
            fields:
              - { label: "Step", name: "title", widget: "string" }
              - { label: "Short explanation", name: "detail", widget: "text", required: false }
          - { label: "Testimonials heading", name: "testimonialsHeading", widget: "string", hint: "The heading above the three short reviews near the top of the order page." }
          - label: "Which testimonials to show"
            name: "testimonialNames"
            widget: "list"
            field: { label: "Client name", name: "name", widget: "string" }
            hint: "The first three names are the three short reviews near the top of the order page. Type each client's name exactly as it appears in \"Testimonials (your Trustpilot reviews)\". The quote is pulled from there. A name that doesn't match is simply skipped. The full list of reviews lower on the order page shows every saved testimonial."
          - { label: "FAQ heading", name: "faqHeading", widget: "string" }
          - label: "FAQ questions & answers"
            name: "faq"
            widget: "list"
            summary: "{{fields.q}}"
            hint: "Each item is one row that opens when tapped. Drag an item's grey bar to reorder, + Add to add, and the small x on the grey bar deletes it."
            fields:
              - { label: "Question", name: "q", widget: "string" }
              - { label: "Answer", name: "a", widget: "text" }
          - { label: "Disclaimer", name: "disclaimer", widget: "text", hint: "The \"exercise, not medical care\" wording. Please check with Nick before shortening this." }
          - label: "Order page (price & payment link)"
            name: "checkout"
            widget: "object"
            hint: "The page where people pay, movewithdianag.com/pilates-program. One price and one pay button. This is where your price and Stripe link live."
            fields:
              - label: "Price and Stripe link"
                name: "payInFull"
                widget: "object"
                hint: "The one price for the program. People who want to pay over time choose that on the Stripe page, not here."
                fields:
                  - { label: "Short name", name: "label", widget: "string", hint: "Shown in the bottom bar on phones and in the subject of the email fallback." }
                  - { label: "Price (number only)", name: "price", widget: "number", value_type: "int", hint: "Just the number, no $ sign. Changing it here does not change what Stripe charges. Update the price in Stripe too, and the price wording in the boxes below." }
                  - { label: "Price as shown", name: "priceDisplay", widget: "string", hint: "For example $897." }
                  - { label: "Small line beside the price", name: "sublabel", widget: "string", required: false, hint: "For example: One payment today." }
                  - { label: "Stripe payment link", name: "stripeUrl", widget: "string", required: false, hint: "Paste your Stripe payment link here (it starts with https://buy.stripe.com/). While empty, the button shows as coming soon and offers to email you instead." }
                  - { label: "Pay button text", name: "buttonLabel", widget: "string", hint: "Keep it short, for example: Start Program" }
              - label: "\"You qualify\" bar (top of the page)"
                name: "qualified"
                widget: "object"
                hint: "A slim bar with a check mark, shown only to someone who just sent the application and is a fit. Everyone else sees the same page without it. To see it yourself, open movewithdianag.com/pilates-program?preview=qualified"
                fields:
                  - { label: "Heading with their name", name: "heading", widget: "string", hint: "Keep {firstName} exactly as written. It is swapped for the person's first name." }
                  - { label: "Heading without a name", name: "headingNoName", widget: "string" }
                  - { label: "Note for people marked \"Needs review\"", name: "reviewNote", widget: "text", hint: "Small text under the pay button. To see it yourself, open movewithdianag.com/pilates-program?preview=qualified&review=1. Shown only to a cleared person who ticked one of the health boxes listed under \"Who is a fit\" in the application form (today: surgery, a serious condition, pregnant, or a recent baby)." }
              - label: "What happens next"
                name: "next"
                widget: "object"
                hint: "The numbered 1, 2, 3 row under the program details. Keep it true to what really happens."
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - label: "Steps"
                    name: "steps"
                    widget: "list"
                    summary: "{{fields.title}}"
                    fields:
                      - { label: "Step", name: "title", widget: "string" }
                      - { label: "Short explanation", name: "detail", widget: "text", required: false, hint: "Leave empty when the step says it all." }
              - { label: "\"Not ready yet?\" question", name: "notReadyQuestion", widget: "string", required: false, hint: "The last row of the questions on the order page. Its answer is one of the sentences below, with the link under it. Leave empty to hide the row." }
              - { label: "\"Not ready yet?\" link text", name: "notReadyLabel", widget: "string", hint: "Used while your quick call booking link is empty (Booking calendars). It opens an email to you." }
              - { label: "\"Not ready yet?\" sentence", name: "notReadyText", widget: "string", hint: "Used while your quick call booking link is empty." }
              - { label: "\"Not ready yet?\" link text, quick call", name: "notReadyCallLabel", widget: "string", required: false, hint: "Used once your quick call booking link is filled in. It opens that calendar. Keep the length of the call true to your calendar. If you leave this empty, the link text above is used." }
              - { label: "\"Not ready yet?\" sentence, quick call", name: "notReadyCallText", widget: "text", required: false, hint: "Used once your quick call booking link is filled in. Say what to do and when, for example pick a time in the next few days." }
              - { label: "Note while the Stripe link is missing", name: "pendingStripeNote", widget: "string", hint: "Shown instead of the pay button until the Stripe payment link above is pasted in." }
              - { label: "Button while the Stripe link is missing", name: "pendingStripeButtonLabel", widget: "string", hint: "Opens an email to you." }
              - label: "Order page extras"
                name: "orderPage"
                widget: "object"
                collapsed: true
                hint: "The smaller labels on the order page, the short lines above the pay button, and the photo."
                fields:
                  - { label: "Greyed-out button while the Stripe link is missing", name: "pendingButtonLabel", widget: "string" }
                  - { label: "Contact page link while the Stripe link is missing", name: "pendingContactLabel", widget: "string" }
                  - { label: "Bottom bar label (phones, screen readers)", name: "stickyBarLabel", widget: "string" }
                  - { label: "Pay button text while Stripe opens", name: "payBusyLabel", widget: "string" }
                  - label: "Short lines above the pay button"
                    name: "highlights"
                    widget: "list"
                    field: { label: "Line", name: "line", widget: "string" }
                    hint: "Three or four lines, each under about 8 words, shown with a check mark in the box above the pay button. Facts only, taken from What's included."
                  - { label: "Star rating", name: "starRating", widget: "number", value_type: "int", min: 0, max: 5, required: false, hint: "The stars shown beside your reviews. Use 5 only while every review on your Trustpilot page is 5 stars. Set 0 to hide the stars." }
                  - { label: "Star rating, read aloud by screen readers", name: "starsLabel", widget: "string", required: false, hint: "Keep {rating} exactly as written." }
                  - { label: "Reviews line under the program name", name: "reviewsLine", widget: "string", required: false, hint: "Keep {count} exactly as written. It is swapped for the number of entries saved in \"Testimonials (your Trustpilot reviews)\"." }
                  - { label: "Link to all reviews on Trustpilot", name: "reviewsLinkLabel", widget: "string", required: false, hint: "The link under the list of reviews. It opens your Trustpilot page." }
                  - { label: "\"Show more reviews\" button", name: "showMoreReviewsLabel", widget: "string", hint: "The list of reviews on the order page shows six first. This button shows the rest." }
                  - { label: "Photo", name: "photo", widget: "image", required: false, hint: "The one large photo of the order page: beside the price on computers, above it on phones. A tall (portrait) photo with you in the middle works best, because phones show only the middle band." }
                  - { label: "Photo description", name: "photoAlt", widget: "string", required: false, hint: "For screen readers. One short sentence." }
                  - { label: "(auto) photo width", name: "photoW", widget: "hidden", required: false }
                  - { label: "(auto) photo height", name: "photoH", widget: "hidden", required: false }
          - label: "Welcome page (after payment)"
            name: "welcome"
            widget: "object"
            hint: "movewithdianag.com/pilates-program/welcome. Stripe sends people here right after they pay."
            fields:
              - { label: "Small label above the heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string", hint: "Used when the site doesn't know the person's first name." }
              - { label: "Heading with their name", name: "headingWithName", widget: "string", hint: "Keep {firstName} exactly as written. It is swapped for the person's first name." }
              - { label: "Intro", name: "intro", widget: "text", required: false, hint: "Leave empty to hide it." }
              - { label: "Receipt note", name: "receiptNote", widget: "string", required: false, hint: "Leave empty to hide it." }
              - { label: "\"Before your assessment\" heading", name: "prepHeading", widget: "string", required: false }
              - label: "Before your assessment"
                name: "prep"
                widget: "list"
                field: { label: "Line", name: "line", widget: "string" }
                required: false
                hint: "Each item is one line. Drag to reorder. With no lines, the whole list is hidden."
              - { label: "\"What happens next\" heading", name: "nextHeading", widget: "string", required: false }
              - label: "What happens next"
                name: "next"
                widget: "list"
                required: false
                summary: "{{fields.title}}"
                hint: "A short timeline under the two calendars. Only promise what really happens, for example when you will message them. Remove every item to hide the block."
                fields:
                  - { label: "When", name: "title", widget: "string" }
                  - { label: "What happens", name: "detail", widget: "text" }
              - { label: "Private hub heading", name: "hubHeading", widget: "string" }
              - { label: "Private hub text", name: "hubText", widget: "text" }
              - { label: "Private hub button", name: "hubButtonLabel", widget: "string" }
              - { label: "Private hub link (Skool)", name: "hubUrl", widget: "string", required: false, hint: "Paste the web address of your private hub here. While empty, the whole private hub block is hidden on the welcome page." }
          - label: "Booking calendars"
            name: "booking"
            widget: "object"
            hint: "The calendars people use to book their assessment, their weekly sessions, and a quick call."
            fields:
              - { label: "Assessment booking link (75 minutes)", name: "assessmentUrl", widget: "string", required: false, hint: "Paste the booking link for your 75-minute online assessment here. While empty, the welcome page shows the \"calendar is being connected\" note below instead of a calendar." }
              - { label: "Weekly session booking link (60 minutes)", name: "sessionUrl", widget: "string", required: false, hint: "Paste the booking link for your 60-minute private sessions here. While empty, the welcome page shows the \"calendar is being connected\" note below instead of a calendar." }
              - { label: "Quick call booking link", name: "callUrl", widget: "string", required: false, hint: "Paste the booking link for a short call here. The \"Not ready yet?\" link on the order page opens your quick call calendar when this link is filled in, and opens an email to you when it is empty." }
              - { label: "Assessment small label", name: "assessmentEyebrow", widget: "string", required: false, hint: "A short line above the heading that says who this step is for. Leave empty to hide it." }
              - { label: "Assessment heading", name: "assessmentHeading", widget: "string", hint: "Step 1 on the welcome page. The step number is added for you." }
              - { label: "Assessment text", name: "assessmentText", widget: "text", hint: "Say what the assessment is and what happens in it. If you mention how many days ahead people can book, keep it the same as in your booking calendar." }
              - { label: "Assessment calendar description", name: "assessmentTitle", widget: "string", hint: "Read aloud by screen readers. Not shown on screen." }
              - { label: "Small note under the assessment text", name: "detailsNote", widget: "string", required: false, hint: "One quiet line under the assessment text, for example about time zones and the confirmation email. Leave empty to hide it." }
              - { label: "\"Calendar is being connected\" note", name: "pendingNote", widget: "string", hint: "Shown in place of a calendar while its booking link is empty." }
              - { label: "\"Open in a new tab\" link text", name: "openLinkLabel", widget: "string" }
              - { label: "Loading message", name: "loadingLabel", widget: "string" }
              - { label: "\"I can't find a time\" button", name: "cantFindLabel", widget: "string", hint: "Shown under each calendar. Opens an email to you that is already started for them." }
              - { label: "\"I can't find a time\" email subject, assessment", name: "cantFindAssessmentSubject", widget: "string" }
              - { label: "\"I can't find a time\" email text", name: "cantFindBody", widget: "text", hint: "The start of the email they send you. Keep it short and end by asking for the days and times that suit them." }
          - label: "Booking pages (one link per calendar)"
            name: "bookingPages"
            widget: "object"
            hint: "Three simple pages you can send to a client so they book by themselves. Each page shows one calendar and nothing else. The web addresses cannot be changed here. The time zone note, the buttons and the booking links come from Booking calendars above."
            fields:
              - label: "15 minute call page"
                name: "introCall"
                widget: "object"
                collapsed: true
                hint: "movewithdianag.com/book/intro-call. It shows the calendar from the Quick call booking link above."
                fields:
                  - { label: "Browser tab title", name: "metaTitle", widget: "string" }
                  - { label: "Short description", name: "metaDescription", widget: "string", required: false, hint: "Shown when the link is shared. The page is hidden from Google." }
                  - { label: "Small label", name: "eyebrow", widget: "string", required: false, hint: "A short line above the heading. Leave empty to hide it." }
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Text", name: "text", widget: "text", hint: "A few short sentences. Press Enter to start a new line on the page. Keep the length of the booking true to your calendar." }
                  - { label: "Calendar description", name: "calendarTitle", widget: "string", hint: "Read aloud by screen readers. Not shown on screen." }
                  - { label: "\"I can't find a time\" email subject", name: "cantFindSubject", widget: "string", required: false, hint: "Leave empty to hide the button on this page." }
              - label: "Assessment page"
                name: "assessment"
                widget: "object"
                collapsed: true
                hint: "movewithdianag.com/book/assessment. It shows the calendar from the Assessment booking link above."
                fields:
                  - { label: "Browser tab title", name: "metaTitle", widget: "string" }
                  - { label: "Short description", name: "metaDescription", widget: "string", required: false, hint: "Shown when the link is shared. The page is hidden from Google." }
                  - { label: "Small label", name: "eyebrow", widget: "string", required: false, hint: "A short line above the heading. Leave empty to hide it." }
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Text", name: "text", widget: "text", hint: "A few short sentences. Press Enter to start a new line on the page. Keep the length of the booking true to your calendar." }
                  - { label: "Calendar description", name: "calendarTitle", widget: "string", hint: "Read aloud by screen readers. Not shown on screen." }
                  - { label: "\"I can't find a time\" email subject", name: "cantFindSubject", widget: "string", required: false, hint: "Leave empty to hide the button on this page." }
              - label: "Private session page"
                name: "session"
                widget: "object"
                collapsed: true
                hint: "movewithdianag.com/book/session. It shows the calendar from the Weekly session booking link above."
                fields:
                  - { label: "Browser tab title", name: "metaTitle", widget: "string" }
                  - { label: "Short description", name: "metaDescription", widget: "string", required: false, hint: "Shown when the link is shared. The page is hidden from Google." }
                  - { label: "Small label", name: "eyebrow", widget: "string", required: false, hint: "A short line above the heading. Leave empty to hide it." }
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Text", name: "text", widget: "text", hint: "A few short sentences. Press Enter to start a new line on the page. Keep the length of the booking true to your calendar." }
                  - { label: "Calendar description", name: "calendarTitle", widget: "string", hint: "Read aloud by screen readers. Not shown on screen." }
                  - { label: "\"I can't find a time\" email subject", name: "cantFindSubject", widget: "string", required: false, hint: "Leave empty to hide the button on this page." }

      # ─────────────────────────── PRIVATE SESSIONS PAGE ───────────────────
      - name: "private"
        label: "Private sessions page (order page)"
        file: "src/content/private.json"
        fields:
          - label: "Search & browser-tab info"
            name: "meta"
            widget: "object"
            collapsed: true
            hint: "What the browser tab shows. The page is hidden from Google on purpose: you send people the link."
            fields:
              - { label: "Browser-tab title", name: "title", widget: "string" }
              - { label: "Search description", name: "description", widget: "text" }
          - { label: "Page title", name: "name", widget: "string" }
          - { label: "Short name", name: "shortName", widget: "string", hint: "In the bar pinned to the bottom of phone screens." }
          - { label: "Description", name: "description", widget: "text", required: false, hint: "Under the title, above the check mark lines. Leave empty to hide it." }
          - { label: "Price", name: "priceDisplay", widget: "string", required: false, hint: "As it should show, for example $150. Leave empty to hide the price." }
          - { label: "Small line beside the price", name: "priceNote", widget: "string", required: false, hint: "For example: per session. Leave empty to hide it." }
          - { label: "Stripe payment link", name: "stripeUrl", widget: "string", required: false, hint: "Paste the Stripe payment link here. While it is empty, the button opens the link below instead." }
          - { label: "Button link while there is no Stripe link", name: "fallbackUrl", widget: "string", required: false, hint: "For example /contact?interest=private-1:1. If both links are empty, the button shows \"Payment link coming soon\"." }
          - { label: "Button text", name: "buttonLabel", widget: "string" }
          - label: "Check mark lines"
            name: "highlights"
            widget: "list"
            field: { label: "Line", name: "line", widget: "string" }
            required: false
            hint: "The short lines in the box above the button. Facts only."
          - { label: "Photo", name: "photo", widget: "image", required: false }
          - { label: "Photo description", name: "photoAlt", widget: "string", hint: "Describe the photo for people who can't see it." }
          - { label: "(auto) photo width", name: "photoW", widget: "hidden", required: false }
          - { label: "(auto) photo height", name: "photoH", widget: "hidden", required: false }
          - { label: "Reviews heading", name: "testimonialsHeading", widget: "string", required: false }
          - label: "Reviews near the top"
            name: "testimonialNames"
            widget: "list"
            field: { label: "Client name", name: "name", widget: "string" }
            required: false
            hint: "Three names, typed exactly as in \"Testimonials (your Trustpilot reviews)\". Remove them all to hide the section."
          - { label: "Second section heading", name: "includedHeading", widget: "string", required: false }
          - label: "Second section lines"
            name: "included"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            hint: "Numbered lines under the heading above. Remove them all to hide the section."
            fields:
              - { label: "Line", name: "title", widget: "string" }
              - { label: "Short explanation", name: "detail", widget: "text", required: false }
          - label: "What happens next"
            name: "next"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - label: "Steps"
                name: "steps"
                widget: "list"
                required: false
                summary: "{{fields.title}}"
                hint: "Only promise what really happens. Remove every step to hide the block."
                fields:
                  - { label: "Step", name: "title", widget: "string" }
                  - { label: "Short explanation", name: "detail", widget: "text", required: false }
          - { label: "Questions heading", name: "faqHeading", widget: "string", required: false }
          - label: "Questions"
            name: "faq"
            widget: "list"
            required: false
            summary: "{{fields.q}}"
            fields:
              - { label: "Question", name: "q", widget: "string" }
              - { label: "Answer", name: "a", widget: "text" }
          - { label: "\"Not ready yet?\" question", name: "notReadyQuestion", widget: "string", required: false, hint: "The last question. Its answer is the sentence below, with an email link under it. Leave empty to hide the row." }
          - { label: "\"Not ready yet?\" email link text", name: "notReadyLabel", widget: "string", required: false }
          - { label: "\"Not ready yet?\" sentence", name: "notReadyText", widget: "text", required: false }
          - { label: "Email subject for questions", name: "questionsSubject", widget: "string", required: false }
          - { label: "Disclaimer at the end", name: "disclaimer", widget: "text", required: false }

      # ─────────────────────────────── INTAKE FORM ─────────────────────────
      - name: "intake"
        label: "Intake form"
        file: "src/content/intake.json"
        fields:
          - label: "Search & browser-tab info"
            name: "meta"
            widget: "object"
            collapsed: true
            hint: "What Google and the browser tab show. The \"not yet\" page is hidden from Google on purpose."
            fields:
              - label: "Application page"
                name: "apply"
                widget: "object"
                fields:
                  - { label: "Browser-tab title", name: "title", widget: "string" }
                  - { label: "Search description", name: "description", widget: "text", hint: "1 to 2 sentences. This is also the preview text when the link is shared. If it mentions how long the form takes, keep it the same as the time estimate at the top of the form." }
              - label: "\"Not yet\" page"
                name: "notYet"
                widget: "object"
                fields:
                  - { label: "Browser-tab title", name: "title", widget: "string" }
                  - { label: "Search description", name: "description", widget: "text" }
          - label: "Form behaviour (advanced)"
            name: "settings"
            widget: "object"
            collapsed: true
            hint: "Advanced: ask Nick before changing anything in this box."
            fields:
              - { label: "Days a half-finished application is remembered", name: "draftMaxAgeDays", widget: "number", value_type: "int", hint: "Only the name, email and phone are remembered on the visitor's device, never the health answers. Advanced: ask Nick before changing." }
              - { label: "Include health answers in the backup email", name: "emailFallbackIncludesAnswers", widget: "boolean", required: false, hint: "Advanced: ask Nick before changing. Off keeps health answers and the screening result out of email: the backup email then carries the name, contact details and where the lead came from only." }
          - label: "Top of the form"
            name: "intro"
            widget: "object"
            hint: "The few lines above the first question."
            fields:
              - { label: "Small label above the heading", name: "eyebrow", widget: "string", required: false, hint: "Leave empty to hide it." }
              - { label: "Time estimate", name: "timeEstimate", widget: "string", required: false, hint: "Shown next to the small label, for example \"About 2 minutes\". Keep it honest: if you add questions, raise it. Leave empty to hide it." }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Sentence under the heading", name: "subline", widget: "text", required: false, hint: "One sentence on why you ask these questions. Leave empty to hide it." }
              - label: "Short reassurances under the sentence"
                name: "points"
                widget: "list"
                required: false
                field: { label: "Reassurance", name: "point", widget: "string" }
                hint: "Two or three very short lines, each shown with a small tick. For example: no payment on this page. Keep them true. Delete them all to hide the list."
          - label: "Questions"
            name: "blocks"
            widget: "list"
            hint: "The whole form is one page. Each item here is one block on that page, in the order people see them. The health question comes first on purpose (safety first). You can freely change the question, the help text and the answer wording. Boxes marked \"value code (internal)\" are wiring that connects the form to your Google Sheet and to the rule that decides who is a fit. Ask Nick before changing those, before adding or deleting a block, and before reordering."
            types:
              - label: "Tick all that apply"
                name: "multi"
                widget: "object"
                summary: "{{fields.question}}"
                fields:
                  - &blockId { label: "Question value code (internal)", name: "id", widget: "string", hint: "Advanced: ask Nick before changing. The Google Sheet and the fit rules find this question by this code." }
                  - &blockQuestion { label: "Question", name: "question", widget: "string" }
                  - &blockHelp { label: "Help text under the question", name: "help", widget: "text", required: false }
                  - &blockRequired { label: "Must be answered", name: "required", widget: "boolean", required: false, hint: "Off lets people leave this one empty." }
                  - &blockRequiredMessage { label: "Message if left empty", name: "requiredMessage", widget: "string", required: false, hint: "Leave empty to use the standard message from \"Error messages\" below." }
                  - &blockLayout { label: "Layout", name: "layout", widget: "select", required: false, options: [{ label: "One column", value: "stack" }, { label: "Two columns", value: "grid" }] }
                  - { label: "\"No medical conditions\" answer, value code (internal)", name: "exclusive", widget: "string", required: false, hint: "Advanced: ask Nick before changing. The one answer that cannot be combined with the others: ticking it clears the rest, and ticking anything else clears it. Leave empty when every answer can be combined." }
                  - &blockOptions
                    label: "Answers"
                    name: "options"
                    widget: "list"
                    summary: "{{fields.label}}"
                    hint: "You can freely change the answer text and drag to reorder. Ask Nick before adding or deleting an answer."
                    fields:
                      - { label: "Answer text", name: "label", widget: "string" }
                      - { label: "Value code (internal)", name: "value", widget: "string", hint: "Advanced: ask Nick before changing. This is what gets saved to your Google Sheet and what the fit rules look at." }
                  - label: "\"Something else\" text box"
                    name: "other"
                    widget: "object"
                    required: false
                    collapsed: true
                    hint: "A text box that opens when one particular answer is ticked."
                    fields:
                      - { label: "Answer that opens the box, value code (internal)", name: "optionValue", widget: "string", required: false, hint: "Advanced: ask Nick before changing." }
                      - { label: "Text box value code (internal)", name: "fieldId", widget: "string", required: false, hint: "Advanced: ask Nick before changing." }
                      - { label: "Text box label", name: "label", widget: "string", required: false }
                      - { label: "Greyed-out example text", name: "placeholder", widget: "string", required: false }
              - label: "Pick one"
                name: "single"
                widget: "object"
                summary: "{{fields.question}}"
                fields:
                  - *blockId
                  - *blockQuestion
                  - *blockHelp
                  - *blockRequired
                  - *blockRequiredMessage
                  - *blockLayout
                  - *blockOptions
                  - label: "Optional text box under the answers"
                    name: "detail"
                    widget: "object"
                    required: false
                    collapsed: true
                    hint: "A box people can fill in if they want to, for example \"Tell me a little more, if you're comfortable.\" It is never required."
                    fields:
                      - { label: "Text box value code (internal)", name: "fieldId", widget: "string", required: false, hint: "Advanced: ask Nick before changing. Leave empty for no text box." }
                      - { label: "Text box label", name: "label", widget: "string", required: false }
                      - { label: "Help text above the box", name: "help", widget: "text", required: false }
                      - { label: "Greyed-out example text", name: "placeholder", widget: "string", required: false, hint: "Shown when none of the examples below fits." }
                      - label: "Examples for one health answer"
                        name: "examples"
                        widget: "list"
                        required: false
                        collapsed: true
                        summary: "{{fields.when}}"
                        hint: "A different greyed-out example when a certain answer was ticked in the first question. If several are ticked, the first example in this list wins."
                        fields:
                          - { label: "When this answer is ticked", name: "when", widget: "select", options: [{ label: "Surgery in the last 6 months", value: "surgery6mo" }, { label: "A serious medical condition", value: "seriousDiagnosis" }, { label: "I'm pregnant", value: "pregnant" }, { label: "I had a baby recently", value: "postpartum" }, { label: "A current injury", value: "currentInjury" }, { label: "Other", value: "other" }] }
                          - { label: "Greyed-out example text", name: "placeholder", widget: "string" }
                      - { label: "Longest answer allowed (characters)", name: "maxLength", widget: "number", value_type: "int", required: false }
              - label: "0 to 10 scale"
                name: "scale"
                widget: "object"
                summary: "{{fields.question}}"
                fields:
                  - *blockId
                  - *blockQuestion
                  - *blockHelp
                  - *blockRequired
                  - *blockRequiredMessage
                  - { label: "Lowest number", name: "min", widget: "number", value_type: "int", required: false, hint: "Advanced: ask Nick before changing." }
                  - { label: "Highest number", name: "max", widget: "number", value_type: "int", required: false, hint: "Advanced: ask Nick before changing." }
                  - { label: "Label at the low end", name: "minLabel", widget: "string", required: false }
                  - { label: "Label at the high end", name: "maxLabel", widget: "string", required: false }
              - label: "Written answer"
                name: "longtext"
                widget: "object"
                summary: "{{fields.question}}"
                fields:
                  - *blockId
                  - *blockQuestion
                  - *blockHelp
                  - *blockRequired
                  - *blockRequiredMessage
                  - { label: "Greyed-out example text", name: "placeholder", widget: "string", required: false }
                  - { label: "Longest answer allowed (characters)", name: "maxLength", widget: "number", value_type: "int", required: false }
              - label: "Contact details"
                name: "contact"
                widget: "object"
                summary: "{{fields.question}}"
                fields:
                  - *blockId
                  - *blockQuestion
                  - *blockHelp
                  - { label: "Must be answered", name: "required", widget: "boolean", required: false, hint: "Each box below has its own \"Must be filled in\" switch. That switch is the one that counts." }
                  - label: "Boxes to fill in"
                    name: "fields"
                    widget: "list"
                    summary: "{{fields.label}}"
                    hint: "You can change the labels and messages. Ask Nick before adding or deleting a box."
                    fields:
                      - { label: "Label", name: "label", widget: "string" }
                      - { label: "Value code (internal)", name: "id", widget: "string", hint: "Advanced: ask Nick before changing. The Google Sheet finds this box by this code." }
                      - { label: "Kind of box (internal)", name: "type", widget: "select", options: [{ label: "Text", value: "text" }, { label: "Email", value: "email" }, { label: "Phone", value: "tel" }], hint: "Advanced: ask Nick before changing." }
                      - { label: "Must be filled in", name: "required", widget: "boolean", required: false }
                      - { label: "Autofill value code (internal)", name: "autoComplete", widget: "string", required: false, hint: "Advanced: ask Nick before changing. Lets phones fill the box in automatically." }
                      - { label: "Capital letters (internal)", name: "autoCapitalize", widget: "select", required: false, options: [{ label: "Capitalise each word", value: "words" }, { label: "No capitals", value: "none" }], hint: "Advanced: ask Nick before changing." }
                      - { label: "Help text under the box", name: "help", widget: "string", required: false }
                      - { label: "Message if left empty", name: "requiredMessage", widget: "string", required: false, hint: "Leave empty to use the standard message." }
                      - { label: "Message if it looks wrong", name: "invalidMessage", widget: "string", required: false, hint: "Leave empty to use the standard message." }
              - label: "Agreement tick box"
                name: "consent"
                widget: "object"
                summary: "{{fields.question}}"
                fields:
                  - *blockId
                  - { label: "Small heading above the tick box", name: "question", widget: "string" }
                  - { label: "Must be ticked", name: "required", widget: "boolean", required: false, hint: "Keep this on. It is how people agree to be contacted." }
                  - { label: "Message if not ticked", name: "requiredMessage", widget: "string", required: false, hint: "Leave empty to use the standard message from \"Error messages\" below." }
                  - { label: "Tick box wording", name: "consentLabel", widget: "text", hint: "One sentence. The person ticks it to say you may contact them about their application." }
                  - { label: "Moving a session line", name: "policyText", widget: "text", required: false, hint: "Optional small print under the tick box. Normally left empty, which hides it. The 24 hours notice line lives in the weekly session text on the welcome page (8-Week Program, Booking calendars)." }
                  - { label: "Privacy line", name: "note", widget: "text", required: false, hint: "A short line under the policy. Leave empty to hide it." }
          - label: "Buttons & small labels"
            name: "labels"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Send button", name: "submit", widget: "string" }
              - { label: "Small line under the send button", name: "submitNote", widget: "text", required: false, hint: "Reassurance at the moment of sending: no payment here, and what the next page shows. Keep it true. Leave empty to hide it." }
              - { label: "Question counter", name: "questionCount", widget: "string", required: false, hint: "The small \"2 of 7\" above each question. Keep {current} and {total} exactly as written. They are swapped for the numbers. Leave empty to hide the counter." }
              - { label: "Send button while sending", name: "submitting", widget: "string" }
              - { label: "\"Optional\" tag", name: "optional", widget: "string" }
              - { label: "Email typo suggestion", name: "emailSuggestion", widget: "string", hint: "Keep {suggestion} exactly as written. It is swapped for the corrected email." }
              - { label: "Accept the suggestion button", name: "emailSuggestionAccept", widget: "string" }
              - { label: "Spoken note when \"No medical conditions\" clears the other ticks", name: "exclusiveCleared", widget: "string", hint: "Read aloud by screen readers. Not shown on screen." }
              - { label: "Spoken note when another tick clears \"No medical conditions\"", name: "exclusiveUnticked", widget: "string", hint: "Read aloud by screen readers. Not shown on screen. Keep {option} exactly as written. It is swapped for the answer that was unticked." }
              - { label: "Spoken note when a tick adds the clearance question", name: "followUpShown", widget: "string", hint: "Read aloud by screen readers. Not shown on screen." }
              - { label: "Spoken note when the clearance question goes away", name: "followUpHidden", widget: "string", hint: "Read aloud by screen readers. Not shown on screen." }
              - { label: "Spam trap label (internal)", name: "honeypotLabel", widget: "string", hint: "Advanced: ask Nick before changing. People never see this." }
          - label: "Error messages"
            name: "errors"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Something is missing", name: "required", widget: "string" }
              - { label: "Nothing picked (pick one)", name: "chooseOne", widget: "string" }
              - { label: "Nothing picked (tick all that apply)", name: "chooseAtLeastOne", widget: "string" }
              - { label: "No number picked on the scale", name: "scaleRequired", widget: "string" }
              - { label: "Email looks wrong", name: "emailInvalid", widget: "string" }
              - { label: "Phone number looks wrong", name: "phoneInvalid", widget: "string" }
              - { label: "Agreement box not ticked", name: "consentRequired", widget: "string" }
              - { label: "Above the send button, one answer missing", name: "summaryOne", widget: "string" }
              - { label: "Above the send button, several answers missing", name: "summaryMany", widget: "string", hint: "Keep {count} exactly as written. It is swapped for the number." }
              - { label: "Sending failed", name: "submitFailed", widget: "string" }
              - { label: "Try again button", name: "retryLabel", widget: "string" }
              - { label: "\"Still stuck?\" text", name: "fallbackText", widget: "string" }
              - { label: "Instagram link text", name: "fallbackInstagramLabel", widget: "string" }
              - { label: "Email link text", name: "fallbackEmailLabel", widget: "string" }
          - label: "Who is a fit (advanced rules)"
            name: "eligibility"
            widget: "object"
            collapsed: true
            hint: "Advanced: ask Nick before changing. These rules decide where a person lands after sending the form: the order page (a fit) or the \"not yet\" page. Someone who ticks \"No medical conditions\" is a fit and is never asked about clearance. Someone who ticks anything else is asked about clearance: only the cleared answer below is a fit, every other answer goes to the \"not yet\" page. If anything here does not match the questions above, the form plays safe and sends people to the \"not yet\" page."
            fields:
              - { label: "Health tick boxes question, value code (internal)", name: "flagsField", widget: "string", hint: "Advanced: ask Nick before changing. The question whose ticks decide whether the clearance question appears." }
              - { label: "Clearance question, value code (internal)", name: "clearanceField", widget: "string", hint: "Advanced: ask Nick before changing. Only shown when a health box other than \"No medical conditions\" is ticked." }
              - { label: "Answer that means cleared, value code (internal)", name: "clearedValue", widget: "string", hint: "Advanced: ask Nick before changing." }
              - label: "Health boxes that add the \"I'll read your notes\" message"
                name: "reviewFlags"
                widget: "list"
                field: { label: "Answer value code (internal)", name: "flag", widget: "string" }
                hint: "Advanced: ask Nick before changing. A cleared person who ticked one of these is still a fit, but sees the extra note under the pay button of the order page (8-Week Program, Order page) and is marked \"Needs review\" in your Google Sheet. Each item is the value code of one answer to the health tick boxes question."
          - label: "\"Not yet\" page"
            name: "notYet"
            widget: "object"
            hint: "movewithdianag.com/apply/not-yet. Where people who are not cleared for exercise land. Kind and warm, with no payment or booking buttons."
            fields:
              - { label: "Small label above the heading", name: "eyebrow", widget: "string" }
              - { label: "Heading with their name", name: "heading", widget: "string", hint: "Keep {firstName} exactly as written. It is swapped for the person's first name." }
              - { label: "Heading without a name", name: "headingNoName", widget: "string" }
              - label: "Message paragraphs"
                name: "body"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
                hint: "Each item is one paragraph. Drag to reorder."
              - { label: "\"What to do next\" heading", name: "nextHeading", widget: "string" }
              - label: "What to do next"
                name: "next"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Step", name: "title", widget: "string" }
                  - { label: "Short explanation", name: "detail", widget: "text" }
              - { label: "\"What to ask your doctor\" heading", name: "askHeading", widget: "string" }
              - { label: "\"What to ask your doctor\" intro", name: "askIntro", widget: "text", required: false }
              - label: "Questions to ask a doctor or PT"
                name: "ask"
                widget: "list"
                field: { label: "Question", name: "question", widget: "string" }
                hint: "Each item is one question. Drag to reorder."
              - { label: "Contact heading", name: "contactHeading", widget: "string", required: false, hint: "Leave empty to hide the whole contact section (heading, Instagram link and email link)." }
              - { label: "Email link text", name: "emailLabel", widget: "string" }
              - { label: "Instagram link text", name: "messageLabel", widget: "string" }
              - { label: "Community heading", name: "communityHeading", widget: "string", required: false, hint: "Leave empty to hide it." }
              - { label: "Community text", name: "communityText", widget: "text", required: false, hint: "Leave empty to hide the community text and its button." }
              - { label: "Community button", name: "communityLabel", widget: "string", hint: "Opens your free Skool community (the Community link in Site settings)." }
              - label: "Newsletter box"
                name: "newsletter"
                widget: "object"
                fields:
                  - { label: "Newsletter name", name: "heading", widget: "string" }
                  - { label: "Description", name: "text", widget: "text" }
                  - { label: "Sign-up button", name: "buttonLabel", widget: "string" }
                  - { label: "Success message", name: "successText", widget: "string" }
                  - { label: "Error message", name: "errorText", widget: "string" }
              - { label: "Disclaimer", name: "disclaimer", widget: "string", required: false, hint: "Leave empty to hide it." }
